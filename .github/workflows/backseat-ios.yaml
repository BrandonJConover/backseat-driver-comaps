name: Backseat Driver iOS
on:
  workflow_dispatch:
  push:
    branches:
      - 'backseat/**'
    paths:
      - 3party/**
      - iphone/**
      - xcode/**
      - libs/**
      - configure.sh
      - .gitmodules
      - .github/workflows/backseat-ios.yaml
  # Pull requests into the Backseat branches build too (they don't publish).
  pull_request:
    branches:
      - 'backseat/**'
      # What's about to ship: a pull request into stage builds before the merge sends it to TestFlight.
      - stage
    paths:
      - 3party/**
      - iphone/**
      - xcode/**
      - libs/**
      - configure.sh
      - .gitmodules
      - .github/workflows/backseat-ios.yaml

jobs:
  ios:
    name: Build iOS (simulator, unsigned)
    # GitHub keys its macOS images by Xcode major version; this one runs macOS 27 on Apple Silicon.
    runs-on: xcode-27
    env:
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The xcode-27 image ships Xcode 27 but its exact point release moves, so pick the newest one
      # and stop if the iOS SDK isn't 27 (App Store Connect requires the iOS 27 SDK from April 2027).
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(dirname "$(dirname "$(xcode-select -p)")")
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE/Contents/Developer"
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "::notice title=Xcode::$(xcodebuild -version | head -1), iOS SDK $SDK, at $XCODE"
          case "$SDK" in 27*) ;; *) echo "::error title=Wrong iOS SDK::Expected iOS 27 SDK, got $SDK"; exit 1;; esac

      - name: Install dependencies
        run: |
          brew install qt optipng
          pip3 install "protobuf<3.21" --break-system-packages
          # Apple's component downloads fail now and then; retry before giving up.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "Attempt $i failed: $*"; sleep 30; done; return 1; }
          retry xcodebuild -downloadComponent metalToolchain
          retry xcodebuild -downloadPlatform iOS

      - uses: actions/checkout@v6

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(sysctl -n hw.logicalcpu) * 20))

      - name: Configure repository
        run: ./configure.sh

      - name: Build
        run: |
          xcodebuild build \
            -workspace xcode/CoMaps.xcworkspace \
            -scheme CoMaps \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
