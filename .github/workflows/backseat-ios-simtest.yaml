name: Backseat Driver iOS simulator drive test
on:
  workflow_dispatch:
  push:
    branches:
      - 'backseat/**'
    paths:
      - .github/workflows/backseat-ios-simtest.yaml
      - iphone/Maps/Core/Backseat/**

permissions:
  contents: write

jobs:
  drive:
    name: Simulated drive in the iOS simulator
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUNDLE: com.brandonjconover.backseatdriver.debug
      MAP_VERSION: '261004'
      MAP_FILE: US_Colorado_Denver.mwm
      # East on Colfax from Broadway to Colorado Blvd, then north a few blocks.
      START: '39.74010,-104.98720'
      DESTINATION: '39.74700,-104.94090'
      OUT: ${{ github.workspace }}/simtest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Install dependencies
        run: |
          brew install qt optipng
          pip3 install "protobuf<3.21" --break-system-packages
          xcodebuild -downloadComponent metalToolchain
          xcodebuild -downloadPlatform iOS

      - uses: actions/checkout@v6

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(sysctl -n hw.logicalcpu) * 20))

      - name: Configure repository
        run: ./configure.sh

      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          xcodebuild build \
            -workspace xcode/CoMaps.xcworkspace \
            -scheme CoMaps \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            -quiet \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$OUT/build.log" | grep -E "error:" || true
          ls -d build/dd/Build/Products/Debug-iphonesimulator/*.app

      - name: Download the Denver map
        run: |
          for server in https://cdn-us-2.comaps.tech https://cdn-fi-1.comaps.app https://comaps.openstreetmap.fr \
                        https://comaps.firewall-gateway.de https://mapgen-fi-1.comaps.app; do
            if curl -fL --retry 2 -o "$MAP_FILE" "$server/maps/$MAP_VERSION/$MAP_FILE"; then
              echo "Got the map from $server"; ls -la "$MAP_FILE"; exit 0
            fi
          done
          echo "::error title=Map download::No mirror served $MAP_FILE for $MAP_VERSION"; exit 1

      - name: Boot a simulator and install
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for rt,devs in d.items() if "iOS" in rt for x in devs if x["name"].startswith("iPhone")]
          print(ids[-1])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location-always "$BUNDLE"
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          mkdir -p "$DATA/Documents/$MAP_VERSION"
          cp "$MAP_FILE" "$DATA/Documents/$MAP_VERSION/"
          xcrun simctl location "$DEVICE" set "$START"

      - name: Drive
        run: |
          shot() { xcrun simctl io "$DEVICE" screenshot "$OUT/$1.png" || true; }
          xcrun simctl spawn "$DEVICE" log stream --level debug --style compact \
            --predicate 'process BEGINSWITH "CoMaps"' > "$OUT/app.log" 2>&1 &
          LOGPID=$!
          sleep 3
          xcrun simctl launch "$DEVICE" "$BUNDLE" -BackseatTestDestination "$DESTINATION"
          sleep 45
          shot 1-route-started

          # Leg 1: east on Colfax at ~45 mph (posted 30-35), with a little wiggle in speed.
          xcrun simctl location "$DEVICE" start --speed=20 \
            39.74010,-104.98720 39.74010,-104.97500 39.74010,-104.96000 39.74010,-104.94090
          sleep 100
          shot 2-speeding-on-colfax
          sleep 110

          # A 3.5 minute stop where the phone never leaves the car: tiny back-and-forth at
          # walking-nothing speed so fixes keep coming with a real (near zero) speed.
          PTS=""
          for i in $(seq 1 40); do
            if [ $((i % 2)) -eq 0 ]; then PTS="$PTS 39.74011,-104.94095"; else PTS="$PTS 39.74010,-104.94094"; fi
          done
          xcrun simctl location "$DEVICE" start --speed=0.02 $PTS
          sleep 120
          shot 3-stopped
          sleep 95

          # Leg 2: north on Colorado Blvd to the destination.
          xcrun simctl location "$DEVICE" start --speed=15 39.74010,-104.94094 39.74700,-104.94090
          sleep 75
          shot 4-arrived
          sleep 10
          kill $LOGPID || true

      - name: Summarize
        if: always()
        run: |
          mkdir -p "$OUT"
          grep -h "Backseat" "$OUT/app.log" > "$OUT/backseat.log" 2>/dev/null || true
          grep -hiE "crash|fatal|assert|terminat" "$OUT/app.log" | tail -40 > "$OUT/problems.log" 2>/dev/null || true
          said=$(grep -c "Backseat says" "$OUT/backseat.log" || true)
          echo "::notice title=Simulator drive::$said Backseat lines spoken"
          msg=$(tail -40 "$OUT/backseat.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Backseat log::${msg}"
          grep -E "error:" "$OUT/build.log" 2>/dev/null | head -20 > "$OUT/build-errors.log" || true
          if [ -s "$OUT/build-errors.log" ]; then
            msg=$(sed -e 's/%/%25/g' "$OUT/build-errors.log" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi

      # Artifacts can't be fetched from the dev container, so results go to a branch.
      - name: Publish results to backseat/test-results
        if: always()
        run: |
          rm -f "$OUT/build.log"
          git config --global user.name "backseat-ci"
          git config --global user.email "backseat-ci@users.noreply.github.com"
          git clone --depth 1 --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
          cd results
          git checkout --orphan backseat/test-results
          git rm -rfq --cached . >/dev/null 2>&1 || true
          rm -rf ./*
          mkdir -p "ios-sim/${{ github.run_number }}"
          cp -R "$OUT"/. "ios-sim/${{ github.run_number }}/"
          git add ios-sim
          git commit -qm "iOS simulator drive ${{ github.run_number }} at ${GITHUB_SHA::7}"
          git push -f origin backseat/test-results
